<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Test Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .card { max-width: 420px; padding: 18px 20px; border: 1px solid #ddd; border-radius: 10px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #bbb; border-radius: 8px; }
    button { margin-top: 14px; padding: 10px 14px; border: 0; border-radius: 8px; background: #2b6cb0; color: #fff; cursor: pointer; }
    #message { margin-top: 14px; font-weight: 700; }
  </style>
</head>
<body>
<div class="card">
  <h2>Login</h2>
  <label for="username">Username</label>
  <input id="username" type="text" autocomplete="off"/>

  <label for="password">Password</label>
  <input id="password" type="password"/>

  <button id="loginBtn" type="button">Login</button>
  <div id="message" aria-live="polite"></div>
</div>

<script>
  (function () {
    const user = document.getElementById('username');
    const pass = document.getElementById('password');
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('message');

    function setMessage(text, ok) {
      msg.textContent = text;
      msg.style.color = ok ? '#2f855a' : '#c53030';
    }

    btn.addEventListener('click', function () {
      const u = (user.value || '').trim();
      const p = (pass.value || '').trim();
      if (u === 'admin' && p === 'admin123') {
        setMessage('Login successful', true);
      } else {
        setMessage('Invalid credentials', false);
      }
    });
  })();
</script>
</body>
</html>
