# Environment: QA / DEV
env=QA

# Browser: chrome / edge
browser=chrome

# Headless execution recommended for CI
headless=true
ci=false
video.recording.enabled=
browser.binary.path=

# Explicit wait timeout
timeout.seconds=15
pageload.timeout.seconds=30

# Retry on failures (0 = disabled)
retry.count=1

# Full-page screenshot on failure (scroll & stitch)
screenshot.fullpage.onFailure=false

# Visual run helpers (set via -Dslowmo.ms=500 etc.)
slowmo.ms=0
keep.browser.open=false

# Default test data for demo forms
testdata.fullName=Test User
testdata.email=test.user@example.com
testdata.phone=9999999999
testdata.company=Solwer QA
testdata.message=Automated test submission
testdata.preferredDemoDateTime=

# Environment URLs (supports classpath: prefix)
QA.url=https://beta.solwerindia.com/
DEV.url=https://beta.solwerindia.com/
