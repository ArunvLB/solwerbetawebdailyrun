name: Daily UI Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: write

concurrency:
  group: daily-ui-tests
  cancel-in-progress: false

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run UI suite
        shell: bash
        env:
          TEST_ENV: QA
          BROWSER: chrome
          HEADLESS: "true"
          CI_MODE: "true"
          VIDEO_RECORDING_ENABLED: "false"
          BROWSER_BINARY_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bash scripts/run-ci.sh

      - name: Commit latest extent report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/extent-report.html
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Update daily extent report"
          git push

      - name: Checkout daily reports repository
        if: always()
        uses: actions/checkout@v4
        with:
          repository: ArunvLB/dailyreports-
          token: ${{ secrets.DAILY_REPORTS_PAT }}
          path: dailyreports-target

      - name: Publish extent report to daily reports repository
        if: always()
        shell: bash
        run: |
          mkdir -p dailyreports-target/solwerDailyReports
          cp reports/extent-report.html dailyreports-target/solwerDailyReports/extent-report.html

          cd dailyreports-target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solwerDailyReports/extent-report.html
          if git diff --cached --quiet; then
            echo "No daily report changes to commit."
            exit 0
          fi
          git commit -m "Update solwer daily extent report"
          git push

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts-${{ github.run_number }}
          path: |
            reports
            screenshots
            recordings
            target/surefire-reports
          if-no-files-found: ignore
