name: Daily UI Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run UI suite
        shell: bash
        env:
          TEST_ENV: QA
          BROWSER: chrome
          HEADLESS: "true"
          CI_MODE: "true"
          VIDEO_RECORDING_ENABLED: "false"
          BROWSER_BINARY_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bash scripts/run-ci.sh

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: |
            reports
            screenshots
            recordings
            target/surefire-reports
          if-no-files-found: ignore
